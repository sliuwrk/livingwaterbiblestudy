<!DOCTYPE html>

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" href="./css/site.min.css?v=20260625.0721">

<body>
	<nav class="navbar navbar-dark navbar-expand-md fixed-top mb-4">
		<div class="container-fluid">
			<a class="navbar-brand fw-bold" data-action="toggle-sidebar"></a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navMenu">
				<ul class="nav navbar-nav ms-auto">

				</ul>
			</div>

	<main id="main">
		<div class="container-fluid">
			<div class="row">
				<div id="sidebar-col" class="col-md-3 col-xl-2 collapsed p-0">
					<ul class="nav nav-pills" id="sidebarTabs">
						<li class="nav-item">
							<button class="nav-link text-light active" data-bs-toggle="tab"
								data-bs-target="#section-bible">
								<i class="fas fa-book-bible"></i>
							</button>
						</li>
						<li class="nav-item">
							<button class="nav-link text-light" data-bs-toggle="tab"
								data-bs-target="#section-bookmarks">
								<i class="fas fa-bookmark"></i>
							</button>
						</li>
						<li class="nav-item">
							<button class="nav-link text-light" data-bs-toggle="tab" data-bs-target="#section-history">
								<i class="fas fa-clock-rotate-left"></i>
							</button>
						</li>
						<li class="flex-grow-1"></li>
						<li class="nav-item">
							<button class="nav-link text-light" data-bs-toggle="tab" data-bs-target="#section-settings">
								<i class="fas fa-cog"></i>
							</button>
						</li>
					</ul>
					<div id="sidebar-content" class="tab-content p-3">
						<div id="section-bible" class="tab-pane fade show active">
							<div class="selector-section">
								<div id="selector-ot"></div>
							</div>
							<div class="selector-section mb-3">
								<div id="selector-nt"></div>
							</div>
						</div>
						<div id="section-bookmarks" class="tab-pane fade">
							<div id="highlight-box" class="list-group"></div>
						</div>
						<div id="section-history" class="tab-pane fade">
							<div id="history-box" class="list-group"></div>
						</div>
						<div id="section-settings" class="tab-pane fade">
							<div class="list-group list-group-flush">
								<div class="list-group-item bg-transparent border-0">
									<label class="form-label">字体大小</label>
									<input type="range" class="form-range" min="16" max="60" id="fontRange">
								</div>

								<div class="list-group-item bg-transparent border-0">
									<label class="form-label">书签和阅读记录</label>
									<button id="clear-all" class="btn btn-sm btn-outline-secondary w-100">
										清除全部
									</button>
								</div>

								<div class="list-group-item bg-transparent border-0">
									<label class="form-label">高亮颜色</label>
									<div id="highlight-color-selector" class="btn-group flex-wrap" role="group">
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div id="content-col" class="col px-4">
					<div id="content-navbar" class="mb-3">
						<div
							class="d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center">
							<div id="view-title" class="page-title"></div>
							<div id="view-menu" class="d-flex gap-2 mt-2 mt-md-0"></div>
						</div>
					</div>
					<article id="view-body"></article>
				</div>
			</div>
		</div>
